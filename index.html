<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de Números</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            color: #1a1a1a;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-mode {
            background-color: #1a1a1a;
            color: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
        }

        .controls-header {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #fff;
            border-radius: 8px;
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
        }

        body.dark-mode .control-group {
            background-color: #2a2a2a;
            border-color: #444;
        }

        button.icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
            color: inherit;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.icon-btn:hover {
            background-color: #e0e0e0;
        }

        body.dark-mode button.icon-btn:hover {
            background-color: #444;
        }

        button.icon-btn:active {
            transform: scale(0.95);
        }

        .font-size-display {
            font-weight: 500;
            min-width: 35px;
            text-align: center;
        }

        .card {
            background-color: #fff;
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 24px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        body.dark-mode .card {
            background-color: #2a2a2a;
            border-color: #444;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: inherit;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            font-size: inherit;
            background-color: inherit;
            color: inherit;
            transition: border-color 0.2s;
        }

        body.dark-mode input[type="number"] {
            background-color: #1a1a1a;
            border-color: #444;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        body.dark-mode input[type="number"]:focus {
            box-shadow: 0 0 0 3px rgba(100,150,255,0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 700px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button.primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0066cc, #0052a3);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button.primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,102,204,0.3);
        }

        button.primary:active:not(:disabled) {
            transform: translateY(0);
        }

        button.primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            color: #d32f2f;
            font-size: 0.95em;
            margin-top: 8px;
            display: none;
        }

        body.dark-mode .error-message {
            color: #ff6b6b;
        }

        .error-message.active {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .resultado-container {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .resultado-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .resultado-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .resultado-info {
            font-size: 0.95em;
            color: #666;
        }

        body.dark-mode .resultado-info {
            color: #999;
        }

        .copy-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background-color: #45a049;
            transform: translateY(-1px);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .copy-btn.copied {
            background-color: #2196f3;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .number-item {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border: 2px solid #0066cc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            font-size: 1.3em;
            font-weight: 700;
            color: #0066cc;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        body.dark-mode .number-item {
            background: linear-gradient(135deg, #1e3a5f, #1a3a6a);
            border-color: #64b5f6;
            color: #64b5f6;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            header {
                margin-bottom: 30px;
            }

            .form-row {
                gap: 12px;
            }

            .controls-header {
                width: 100%;
                justify-content: space-between;
            }

            .numbers-grid {
                grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
                gap: 10px;
            }
        }

        .audio-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #4caf50;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎲 Sorteador</h1>
            <div class="controls-header">
                <div class="control-group">
                    <button class="icon-btn" id="themToggle" title="Alternar tema">
                        <span id="themeIcon">🌙</span>
                    </button>
                </div>
                <div class="control-group">
                    <button class="icon-btn" id="decreaseFont" title="Diminuir fonte">−</button>
                    <span class="font-size-display" id="fontSizeDisplay">16px</span>
                    <button class="icon-btn" id="increaseFont" title="Aumentar fonte">+</button>
                </div>
            </div>
        </header>

        <div class="card">
            <form id="sorteioForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="numeroInicial">Número Inicial</label>
                        <input type="number" id="numeroInicial" required min="0" value="1">
                        <div class="error-message" id="erroInicial"></div>
                    </div>

                    <div class="form-group">
                        <label for="numeroFinal">Número Final</label>
                        <input type="number" id="numeroFinal" required min="0" value="100">
                        <div class="error-message" id="erroFinal"></div>
                    </div>

                    <div class="form-group">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" required min="1" value="10">
                        <div class="error-message" id="erroQuantidade"></div>
                    </div>
                </div>

                <button type="submit" class="primary" id="btnSortear">Sortear Números</button>
                <div class="error-message" id="erroGeral"></div>
            </form>
        </div>

        <div class="card resultado-container" id="resultadoContainer">
            <div class="resultado-header">
                <div>
                    <h2 style="font-size: 1.5em; margin-bottom: 8px;">Resultado do Sorteio</h2>
                    <div class="resultado-info" id="resultadoInfo"></div>
                </div>
                <button class="copy-btn" id="btnCopiar">📋 Copiar</button>
            </div>

            <div class="numbers-grid" id="numerosGrid"></div>
        </div>
    </div>

    <script>
        let fontSizeBase = 16;
        let numerosSorteados = [];

        const elementos = {
            form: document.getElementById('sorteioForm'),
            numeroInicial: document.getElementById('numeroInicial'),
            numeroFinal: document.getElementById('numeroFinal'),
            quantidade: document.getElementById('quantidade'),
            btnSortear: document.getElementById('btnSortear'),
            themeToggle: document.getElementById('themToggle'),
            themeIcon: document.getElementById('themeIcon'),
            decreaseFont: document.getElementById('decreaseFont'),
            increaseFont: document.getElementById('increaseFont'),
            fontSizeDisplay: document.getElementById('fontSizeDisplay'),
            resultadoContainer: document.getElementById('resultadoContainer'),
            numerosGrid: document.getElementById('numerosGrid'),
            btnCopiar: document.getElementById('btnCopiar'),
            resultadoInfo: document.getElementById('resultadoInfo'),
            erroGeral: document.getElementById('erroGeral'),
            erroInicial: document.getElementById('erroInicial'),
            erroFinal: document.getElementById('erroFinal'),
            erroQuantidade: document.getElementById('erroQuantidade'),
        };

        function carregarPreferencias() {
            const tema = localStorage.getItem('tema') || 'light';
            const fontSize = localStorage.getItem('fontSize') || '16';

            if (tema === 'dark') {
                document.body.classList.add('dark-mode');
                elementos.themeIcon.textContent = '☀️';
            }

            fontSizeBase = parseInt(fontSize);
            aplicarFontSize();
        }

        function salvarPreferencias() {
            localStorage.setItem('tema', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            localStorage.setItem('fontSize', fontSizeBase.toString());
        }

        elementos.themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            elementos.themeIcon.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
            salvarPreferencias();
        });

        function aplicarFontSize() {
            document.documentElement.style.fontSize = fontSizeBase + 'px';
            elementos.fontSizeDisplay.textContent = fontSizeBase + 'px';
        }

        elementos.increaseFont.addEventListener('click', () => {
            if (fontSizeBase < 24) {
                fontSizeBase += 2;
                aplicarFontSize();
                salvarPreferencias();
            }
        });

        elementos.decreaseFont.addEventListener('click', () => {
            if (fontSizeBase > 12) {
                fontSizeBase -= 2;
                aplicarFontSize();
                salvarPreferencias();
            }
        });

        function limparErros() {
            document.querySelectorAll('.error-message').forEach(el => el.classList.remove('active'));
        }

        function mostrarErro(elemento, mensagem) {
            elemento.textContent = mensagem;
            elemento.classList.add('active');
        }

        function validarInputs() {
            limparErros();

            const inicial = parseInt(elementos.numeroInicial.value);
            const final = parseInt(elementos.numeroFinal.value);
            const qtd = parseInt(elementos.quantidade.value);

            if (isNaN(inicial) || isNaN(final) || isNaN(qtd)) {
                mostrarErro(elementos.erroGeral, 'Preencha todos os campos com números válidos');
                return false;
            }

            if (inicial > final) {
                mostrarErro(elementos.erroInicial, 'Deve ser menor ou igual ao número final');
                return false;
            }

            const intervalo = final - inicial + 1;
            if (qtd > intervalo) {
                mostrarErro(elementos.erroQuantidade, `Máximo de ${intervalo} números únicos neste intervalo`);
                return false;
            }

            if (qtd <= 0) {
                mostrarErro(elementos.erroQuantidade, 'Deve ser maior que zero');
                return false;
            }

            return true;
        }

        function gerarNumerosUnicos(inicio, fim, quantidade) {
            const numeros = [];
            const disponveis = new Set();

            for (let i = inicio; i <= fim; i++) {
                disponveis.add(i);
            }

            while (numeros.length < quantidade) {
                const array = Array.from(disponveis);
                const indice = Math.floor(Math.random() * array.length);
                const numero = array[indice];
                numeros.push(numero);
                disponveis.delete(numero);
            }

            return numeros.sort((a, b) => a - b);
        }

        function tocarSom() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const notas = [440, 494, 523];

            notas.forEach((freq, index) => {
                const oscilador = audioContext.createOscillator();
                const ganho = audioContext.createGain();

                oscilador.connect(ganho);
                ganho.connect(audioContext.destination);

                oscilador.frequency.value = freq;
                oscilador.type = 'sine';

                ganho.gain.setValueAtTime(0.3, audioContext.currentTime);
                ganho.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

                oscilador.start(audioContext.currentTime + index * 0.1);
                oscilador.stop(audioContext.currentTime + index * 0.1 + 0.1);
            });
        }

        function exibirResultado(numeros) {
            numerosSorteados = numeros;

            elementos.numerosGrid.innerHTML = '';
            numeros.forEach(num => {
                const div = document.createElement('div');
                div.className = 'number-item';
                div.textContent = num;
                elementos.numerosGrid.appendChild(div);
            });

            const inicial = parseInt(elementos.numeroInicial.value);
            const final = parseInt(elementos.numeroFinal.value);
            elementos.resultadoInfo.textContent = `Sorteio de ${numeros.length} número(s) entre ${inicial} e ${final}`;

            elementos.resultadoContainer.classList.add('active');

            try {
                tocarSom();
            } catch (e) {
                console.log('Som não disponível');
            }
        }

        elementos.form.addEventListener('submit', (e) => {
            e.preventDefault();

            if (validarInputs()) {
                const inicial = parseInt(elementos.numeroInicial.value);
                const final = parseInt(elementos.numeroFinal.value);
                const qtd = parseInt(elementos.quantidade.value);

                const numeros = gerarNumerosUnicos(inicial, final, qtd);
                exibirResultado(numeros);
            }
        });

        elementos.btnCopiar.addEventListener('click', () => {
            const texto = numerosSorteados.join(', ');
            navigator.clipboard.writeText(texto).then(() => {
                elementos.btnCopiar.textContent = '✓ Copiado!';
                elementos.btnCopiar.classList.add('copied');

                setTimeout(() => {
                    elementos.btnCopiar.textContent = '📋 Copiar';
                    elementos.btnCopiar.classList.remove('copied');
                }, 2000);
            });
        });

        carregarPreferencias();
    </script>
</body>
</html>
